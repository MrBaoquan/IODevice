[default]
# Simulator is an independent IOUI plugin for development-time data simulation.
# It does not modify DEBUGGER and does not connect to real hardware.

# Core simulation tick.
tick_ms=50

# Mechanism travel durations (ms). The plugin ramps AD feedback over these durations.
#   door_duration_ms    -> DO[35] open / DO[36] close
#   lap_bar_duration_ms -> DO[32] seat_belt_lock, DO[33] lap_bar_down, DO[34] lap_bar_up
#   carrier_duration_ms -> DO[44] to_presentation / DO[45] to_parked
door_duration_ms=3000
lap_bar_duration_ms=3000
carrier_duration_ms=3000

# 特效确认延迟（ms）。DI[16..22] 与 AD[32..38] 在收到 DO[16..22] 命令后，
# 经过该延迟才反映为实际状态与强度，避免「DO 即时镜像为 DI/AD」的伪反馈。
effect_confirm_ms=180

# Local built-in UI placeholder. The first implementation keeps this disabled until
# the independent Simulator UI adapter is added.
embedded_ui=0

# Web UI. The plugin owns the local HTTP service and will extend it with WebSocket
# and browser session reuse in the next increment.
# Windows binds 127.0.0.1; other platforms (Android) bind 0.0.0.0 so the debug page
# is reachable over LAN. There is no authentication by design — dev-time tool only.
web_enabled=1
web_port=18080
web_auto_open=resume

# Motion channel mapping (docs/动感平台统一通道协议约定.md §3):
#   DO[0]  duration_ms        DO[1]  pitch              DO[2]  yaw
#   DO[3]  roll               DO[4]  x                  DO[5]  y
#   DO[6]  z                  DO[7]  angle              DO[8]  speed_level
#   DO[9]  reset              DO[10] emergency_stop     DO[11] motion_enable
#   DO[16..22] water / snow / wind / fog / hot / light / vibrate
#   DO[32] seat_belt_lock     DO[33] lap_bar_down       DO[34] lap_bar_up
#   DO[35] door_open          DO[36] door_close
#   DO[44] carrier_to_presentation  DO[45] carrier_to_parked  DO[46] carrier_hold
#   DI[0]  system_ready       DI[1]  motion_enabled     DI[2]  effect_enabled
#   DI[32..39] seat_belt_locked / lap_bar_down_done / lap_bar_up_done /
#              door_opened / door_closed / door_opening / door_closing / mech_moving
#   DI[46] interlock_ok       DI[48..52] carrier at presentation / parked /
#              moving_to_presentation / moving_to_parked / holding
#   AD[16] door_position_percent   AD[17] door_angle
#   AD[18] lap_bar_position_percent  AD[22] carrier_position_percent
# 三维视图的旋转轴序、正方向与行程上限见 README.md「三维视图约定」。

# 动感平台行程上限与机构几何（经 capabilities 的 motion 块下发给前端三维视图，
# 前端不再硬编码；这里的值是兜底默认，现场应按真实设备行程填写）。
#   motion_travel_*  姿态/位移/转台软限位，三维视图按此钳制并提示超行程
#   leg_stroke_*     电缸行程范围（mm），用于三维视图杆件长度校验提示
motion_travel_pitch_deg=30
motion_travel_yaw_deg=30
motion_travel_roll_deg=30
motion_travel_x_mm=300
motion_travel_y_mm=300
motion_travel_z_mm=300
motion_travel_angle_deg=360
leg_stroke_min_mm=250
leg_stroke_max_mm=1400

# 三维场景比例尺：1 场景单位 = mm_per_unit 毫米。
# 必须与下面的机构几何一致：平台本体约 2~3 m、电缸行程数百 mm，
# 因此取 1000（1 单位 = 1 米）。若改成 100，几百毫米的行程会被放大成
# 与平台同量级的位移，模型会明显失真。
mm_per_unit=1000

[device_0]
# tick_ms=50
# door_duration_ms=3000
# lap_bar_duration_ms=3000
# carrier_duration_ms=3000
# embedded_ui=0
# web_enabled=1
# web_port=18080
# web_auto_open=resume


# ---- 通道工程量程兜底（归一化 0..1 -> [min, max]）----
# 首选来源: 设备自述 capabilities —— RPC topic "plugin.capabilities" 的
#   motion.channel_range[]，由插件从其 travel 配置派生，与三维视图软限位同源。
# 本段仅在 capabilities 不可用时兜底（宿主 DeviceRangeCatalog 的优先级: capabilities > 本段 > 直通）。
# 数值与 motion_travel_* 同源；改平台只改这里，动作文件保持设备无关。
[channel_range]
OAxis_01 = -30, 30, deg
OAxis_02 = -30, 30, deg
OAxis_03 = -30, 30, deg
OAxis_04 = -300, 300, mm
OAxis_05 = -300, 300, mm
OAxis_06 = -300, 300, mm
OAxis_07 = -360, 360, deg
OAxis_16 = 0, 1, bool
OAxis_17 = 0, 1, bool
OAxis_18 = 0, 1, bool
OAxis_19 = 0, 1, bool
OAxis_20 = 0, 1, bool
OAxis_21 = 0, 1, bool
OAxis_22 = 0, 1, bool