<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', sans-serif; fill: #10243e; }
      .subtitle { font: 500 18px 'Microsoft YaHei', sans-serif; fill: #355070; }
      .label { font: 600 20px 'Microsoft YaHei', sans-serif; fill: #16324f; }
      .text { font: 500 16px 'Microsoft YaHei', sans-serif; fill: #274c77; }
      .small { font: 500 14px 'Microsoft YaHei', sans-serif; fill: #4a627a; }
      .box { fill: #f7fbff; stroke: #35608a; stroke-width: 2.2; rx: 18; ry: 18; }
      .core { fill: #eef6ff; stroke: #204a73; stroke-width: 2.6; rx: 20; ry: 20; }
      .accent { fill: #fff6e9; stroke: #ba7a1d; stroke-width: 2.2; rx: 18; ry: 18; }
      .line { stroke: #355c7d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355c7d" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff" />
  <text x="800" y="58" text-anchor="middle" class="title">图1 面向异构 IO 设备的统一通道抽象与时序编排执行系统总体结构框图</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">对应实际实现：IODevice + IOStudio + 协议发送器 + 设备配置/状态反馈链路</text>

  <rect x="70" y="180" width="280" height="440" class="box" />
  <text x="210" y="220" text-anchor="middle" class="label">异构目标设备层</text>
  <rect x="105" y="255" width="210" height="55" class="accent" />
  <text x="210" y="290" text-anchor="middle" class="text">板卡 / Joystick / 传感器</text>
  <rect x="105" y="330" width="210" height="55" class="accent" />
  <text x="210" y="365" text-anchor="middle" class="text">串口 / TCP / UDP / Modbus</text>
  <rect x="105" y="405" width="210" height="55" class="accent" />
  <text x="210" y="440" text-anchor="middle" class="text">动感平台 / 灯光 / 风机 / 烟雾</text>
  <rect x="105" y="480" width="210" height="90" class="accent" />
  <text x="210" y="515" text-anchor="middle" class="text">原始物理通道</text>
  <text x="210" y="545" text-anchor="middle" class="small">DI / AD / DO / OAction / OAxis</text>

  <rect x="420" y="145" width="360" height="510" class="core" />
  <text x="600" y="190" text-anchor="middle" class="label">统一通道抽象与适配层</text>
  <rect x="455" y="220" width="290" height="70" class="box" />
  <text x="600" y="250" text-anchor="middle" class="text">设备描述获取模块</text>
  <text x="600" y="275" text-anchor="middle" class="small">Schema / XML / INI / 设备能力定义</text>
  <rect x="455" y="315" width="290" height="80" class="box" />
  <text x="600" y="350" text-anchor="middle" class="text">统一逻辑通道建模模块</text>
  <text x="600" y="378" text-anchor="middle" class="small">统一命名、通道类型归一、寻址映射</text>
  <rect x="455" y="420" width="290" height="80" class="box" />
  <text x="600" y="455" text-anchor="middle" class="text">协议适配与执行解析模块</text>
  <text x="600" y="483" text-anchor="middle" class="small">TCP / UDP / Serial / NetIO / Modbus / Driver</text>
  <rect x="455" y="525" width="290" height="95" class="box" />
  <text x="600" y="560" text-anchor="middle" class="text">状态反馈映射模块</text>
  <text x="600" y="590" text-anchor="middle" class="small">连接状态 / 通道值 / 执行结果 / 异常事件</text>

  <rect x="850" y="145" width="330" height="510" class="core" />
  <text x="1015" y="190" text-anchor="middle" class="label">时序编排与执行层</text>
  <rect x="885" y="220" width="260" height="78" class="box" />
  <text x="1015" y="255" text-anchor="middle" class="text">编排任务构建模块</text>
  <text x="1015" y="282" text-anchor="middle" class="small">测试流程 / 事件流程 / 动作时间线</text>
  <rect x="885" y="325" width="260" height="78" class="box" />
  <text x="1015" y="360" text-anchor="middle" class="text">时序执行引擎</text>
  <text x="1015" y="387" text-anchor="middle" class="small">按逻辑通道执行、按时间推进</text>
  <rect x="885" y="430" width="260" height="78" class="box" />
  <text x="1015" y="465" text-anchor="middle" class="text">闭环控制模块</text>
  <text x="1015" y="492" text-anchor="middle" class="small">依据反馈更新状态并触发后续动作</text>
  <rect x="885" y="535" width="260" height="85" class="box" />
  <text x="1015" y="570" text-anchor="middle" class="text">执行日志与结果记录</text>
  <text x="1015" y="598" text-anchor="middle" class="small">时间戳、调用结果、异常轨迹</text>

  <rect x="1260" y="210" width="260" height="180" class="box" />
  <text x="1390" y="250" text-anchor="middle" class="label">上位机应用层</text>
  <text x="1390" y="290" text-anchor="middle" class="text">IOStudio</text>
  <text x="1390" y="322" text-anchor="middle" class="small">配置 / 测试 / 监控 / 事件转发</text>
  <text x="1390" y="352" text-anchor="middle" class="small">时间轴编辑 / 执行观察 / 结果展示</text>

  <rect x="1260" y="455" width="260" height="135" class="box" />
  <text x="1390" y="495" text-anchor="middle" class="label">运行时核心</text>
  <text x="1390" y="530" text-anchor="middle" class="text">IODevice / Wrapper / Protocol Senders</text>
  <text x="1390" y="560" text-anchor="middle" class="small">统一执行接口与设备派发</text>

  <path d="M 350 400 C 385 400, 395 400, 420 400" class="line" />
  <path d="M 780 400 C 815 400, 820 400, 850 400" class="line" />
  <path d="M 1180 310 C 1210 310, 1225 300, 1260 300" class="line" />
  <path d="M 1180 520 C 1215 520, 1225 520, 1260 520" class="line" />
  <path d="M 1260 555 C 1195 555, 1180 555, 1180 555 C 1110 555, 1110 555, 1110 555" class="line" />
  <path d="M 1015 655 C 1015 720, 600 720, 600 655" class="line" />
  <path d="M 600 145 C 600 115, 1015 115, 1015 145" stroke="#9ab3c8" stroke-width="2" fill="none" stroke-dasharray="8 8" />
  <text x="810" y="745" text-anchor="middle" class="small">闭环路径：设备执行结果回写统一逻辑通道模型，并驱动后续编排决策</text>
</svg>