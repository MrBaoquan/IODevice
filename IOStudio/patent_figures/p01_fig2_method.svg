<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', sans-serif; fill: #10243e; }
      .step { fill: #f7fbff; stroke: #305f86; stroke-width: 2.4; rx: 18; ry: 18; }
      .text { font: 600 22px 'Microsoft YaHei', sans-serif; fill: #16324f; }
      .small { font: 500 16px 'Microsoft YaHei', sans-serif; fill: #44627e; }
      .line { stroke: #355c7d; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355c7d" />
    </marker>
  </defs>
  <rect width="1200" height="1600" fill="#fff" />
  <text x="600" y="55" text-anchor="middle" class="title">图2 面向异构 IO 设备的统一通道抽象与时序编排执行方法流程图</text>
  <rect x="420" y="95" width="360" height="85" class="step" /><text x="600" y="145" text-anchor="middle" class="text">S1 获取目标设备描述信息</text><text x="600" y="170" text-anchor="middle" class="small">设备标识、通道类型、协议类型、配置参数</text>
  <rect x="420" y="255" width="360" height="95" class="step" /><text x="600" y="308" text-anchor="middle" class="text">S2 建立统一逻辑通道模型</text><text x="600" y="335" text-anchor="middle" class="small">将 DI / AD / DO / OAction / OAxis 映射为统一通道</text>
  <rect x="420" y="425" width="360" height="95" class="step" /><text x="600" y="478" text-anchor="middle" class="text">S3 构建时序编排任务</text><text x="600" y="505" text-anchor="middle" class="small">测试序列、事件序列、动作时间线</text>
  <rect x="420" y="595" width="360" height="95" class="step" /><text x="600" y="648" text-anchor="middle" class="text">S4 解析逻辑通道操作</text><text x="600" y="675" text-anchor="middle" class="small">选择协议调用、驱动调用或设备接口调用</text>
  <rect x="420" y="765" width="360" height="95" class="step" /><text x="600" y="818" text-anchor="middle" class="text">S5 派发到目标设备执行</text><text x="600" y="845" text-anchor="middle" class="small">TCP / UDP / Serial / Modbus / Driver / Wrapper</text>
  <rect x="420" y="935" width="360" height="95" class="step" /><text x="600" y="988" text-anchor="middle" class="text">S6 采集状态反馈信息</text><text x="600" y="1015" text-anchor="middle" class="small">通道值、连接状态、异常状态、返回事件</text>
  <rect x="420" y="1105" width="360" height="95" class="step" /><text x="600" y="1158" text-anchor="middle" class="text">S7 更新编排状态并触发后续动作</text><text x="600" y="1185" text-anchor="middle" class="small">形成执行闭环与流程复用</text>
  <rect x="420" y="1295" width="360" height="110" class="step" /><text x="600" y="1350" text-anchor="middle" class="text">S8 记录执行结果</text><text x="600" y="1380" text-anchor="middle" class="small">保存时间戳、结果、重试、终止或告警信息</text>
  <path d="M 600 180 L 600 255" class="line" /><path d="M 600 350 L 600 425" class="line" /><path d="M 600 520 L 600 595" class="line" /><path d="M 600 690 L 600 765" class="line" /><path d="M 600 860 L 600 935" class="line" /><path d="M 600 1030 L 600 1105" class="line" /><path d="M 600 1200 L 600 1295" class="line" />
  <path d="M 420 1155 C 260 1155, 240 1000, 240 745 C 240 460, 250 310, 420 310" stroke="#8faec9" stroke-width="2.5" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow)" />
  <text x="215" y="730" text-anchor="middle" class="small">状态反馈触发后续逻辑</text>
</svg>