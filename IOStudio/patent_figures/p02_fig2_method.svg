<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><defs><style>.title{font:700 28px 'Microsoft YaHei',sans-serif;fill:#10243e}.step{fill:#f7fbff;stroke:#305f86;stroke-width:2.4;rx:18;ry:18}.text{font:600 22px 'Microsoft YaHei',sans-serif;fill:#16324f}.small{font:500 16px 'Microsoft YaHei',sans-serif;fill:#44627e}.line{stroke:#355c7d;stroke-width:3.2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#355c7d"/></marker></defs><rect width="1200" height="1500" fill="#fff"/><text x="600" y="55" text-anchor="middle" class="title">图2 基于事件、条件、动作与时间轴融合的多设备联动编排方法流程图</text><rect x="390" y="105" width="420" height="92" class="step"/><text x="600" y="155" text-anchor="middle" class="text">S1 构建统一编排模型</text><text x="600" y="182" text-anchor="middle" class="small">事件节点、条件节点、动作节点、时间轴片段节点</text><rect x="390" y="255" width="420" height="92" class="step"/><text x="600" y="305" text-anchor="middle" class="text">S2 接收外部或内部事件</text><text x="600" y="332" text-anchor="middle" class="small">设备输入、状态事件、关键帧事件、网络命令</text><rect x="390" y="405" width="420" height="92" class="step"/><text x="600" y="455" text-anchor="middle" class="text">S3 执行条件节点判定</text><text x="600" y="482" text-anchor="middle" class="small">值比较、时间位置、状态条件、组合逻辑</text><rect x="390" y="555" width="420" height="92" class="step"/><text x="600" y="605" text-anchor="middle" class="text">S4 触发动作节点或时间轴片段</text><text x="600" y="632" text-anchor="middle" class="small">离散动作直接执行，连续控制进入时间推进</text><rect x="390" y="705" width="420" height="92" class="step"/><text x="600" y="755" text-anchor="middle" class="text">S5 连续求值并输出控制值</text><text x="600" y="782" text-anchor="middle" class="small">关键帧插值、曲线求值、实时输出</text><rect x="390" y="855" width="420" height="92" class="step"/><text x="600" y="905" text-anchor="middle" class="text">S6 在时间轴执行过程中检测事件规则</text><text x="600" y="932" text-anchor="middle" class="small">特定时间点、关键帧事件、输出值变化</text><rect x="390" y="1005" width="420" height="92" class="step"/><text x="600" y="1055" text-anchor="middle" class="text">S7 触发离散联动动作</text><text x="600" y="1082" text-anchor="middle" class="small">灯光、风机、协议发送、状态切换</text><rect x="390" y="1175" width="420" height="95" class="step"/><text x="600" y="1228" text-anchor="middle" class="text">S8 完成统一调度闭环</text><text x="600" y="1255" text-anchor="middle" class="small">事件驱动与连续控制在同一模型下统一执行</text><path d="M600 197 L600 255" class="line"/><path d="M600 347 L600 405" class="line"/><path d="M600 497 L600 555" class="line"/><path d="M600 647 L600 705" class="line"/><path d="M600 797 L600 855" class="line"/><path d="M600 947 L600 1005" class="line"/><path d="M600 1100 L600 1175" class="line"/><path d="M 810 902 C 980 902, 980 601, 810 601" stroke="#8faec9" stroke-width="2.5" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="995" y="755" class="small">执行中再次触发离散动作</text></svg>