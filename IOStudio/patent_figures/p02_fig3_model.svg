<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.title{font:700 28px 'Microsoft YaHei',sans-serif;fill:#10243e}.label{font:600 22px 'Microsoft YaHei',sans-serif;fill:#16324f}.text{font:500 17px 'Microsoft YaHei',sans-serif;fill:#274c77}.box{fill:#f7fbff;stroke:#35608a;stroke-width:2.2;rx:18;ry:18}.event{fill:#eef6ff}.cond{fill:#f7fff3}.action{fill:#fff8ef}.timeline{fill:#f9f2ff}.line{stroke:#355c7d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#355c7d"/></marker></defs><rect width="1400" height="900" fill="#fff"/><text x="700" y="55" text-anchor="middle" class="title">图3 统一编排模型的节点关系示意图</text><rect x="110" y="300" width="220" height="90" class="box event"/><text x="220" y="352" text-anchor="middle" class="label">事件节点</text><rect x="430" y="180" width="220" height="90" class="box cond"/><text x="540" y="232" text-anchor="middle" class="label">条件节点A</text><rect x="430" y="430" width="220" height="90" class="box cond"/><text x="540" y="482" text-anchor="middle" class="label">条件节点B</text><rect x="770" y="170" width="220" height="90" class="box action"/><text x="880" y="222" text-anchor="middle" class="label">动作节点</text><rect x="770" y="430" width="220" height="90" class="box timeline"/><text x="880" y="482" text-anchor="middle" class="label">时间轴片段节点</text><rect x="1080" y="300" width="220" height="90" class="box"/><text x="1190" y="352" text-anchor="middle" class="label">设备派发节点</text><path d="M330 345 L430 225" class="line"/><path d="M330 345 L430 475" class="line"/><path d="M650 225 L770 215" class="line"/><path d="M650 475 L770 475" class="line"/><path d="M650 225 C720 225, 720 420, 770 465" class="line"/><path d="M990 215 C1040 215, 1040 315, 1080 345" class="line"/><path d="M990 475 C1040 475, 1040 390, 1080 355" class="line"/><text x="700" y="660" text-anchor="middle" class="text">事件节点可触发条件判定，条件节点既可触发离散动作，也可启动时间轴片段；时间轴片段执行中还可再次触发动作节点</text></svg>