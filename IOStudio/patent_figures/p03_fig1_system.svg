<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.title{font:700 28px 'Microsoft YaHei',sans-serif;fill:#10243e}.label{font:600 22px 'Microsoft YaHei',sans-serif;fill:#16324f}.text{font:500 17px 'Microsoft YaHei',sans-serif;fill:#274c77}.small{font:500 14px 'Microsoft YaHei',sans-serif;fill:#55738f}.box{fill:#f7fbff;stroke:#35608a;stroke-width:2.2;rx:18;ry:18}.core{fill:#eef6ff;stroke:#204a73;stroke-width:2.6;rx:18;ry:18}.line{stroke:#355c7d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#355c7d"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="55" text-anchor="middle" class="title">图1 多控制源输出仲裁、安全约束与平滑回退的设备控制系统总体结构框图</text><rect x="70" y="230" width="280" height="380" class="box"/><text x="210" y="275" text-anchor="middle" class="label">多控制源层</text><rect x="100" y="315" width="220" height="60" class="box"/><text x="210" y="352" text-anchor="middle" class="text">时间轴槽位 Slot A</text><rect x="100" y="395" width="220" height="60" class="box"/><text x="210" y="432" text-anchor="middle" class="text">时间轴槽位 Slot B</text><rect x="100" y="475" width="220" height="60" class="box"/><text x="210" y="512" text-anchor="middle" class="text">事件 / 规则 / 人工干预</text><rect x="100" y="555" width="220" height="40" class="box"/><text x="210" y="580" text-anchor="middle" class="small">不同优先级与混合策略</text><rect x="450" y="170" width="380" height="500" class="core"/><text x="640" y="215" text-anchor="middle" class="label">运行时控制内核</text><rect x="490" y="255" width="300" height="70" class="box"/><text x="640" y="297" text-anchor="middle" class="text">候选输出获取模块</text><rect x="490" y="345" width="300" height="70" class="box"/><text x="640" y="387" text-anchor="middle" class="text">通道聚合与仲裁模块</text><rect x="490" y="435" width="300" height="70" class="box"/><text x="640" y="477" text-anchor="middle" class="text">安全约束模块</text><rect x="490" y="525" width="300" height="95" class="box"/><text x="640" y="565" text-anchor="middle" class="text">平滑回退模块</text><text x="640" y="595" text-anchor="middle" class="small">停止、退出、结束时回退至安全目标值</text><rect x="930" y="230" width="280" height="380" class="box"/><text x="1070" y="275" text-anchor="middle" class="label">设备派发层</text><rect x="960" y="315" width="220" height="60" class="box"/><text x="1070" y="352" text-anchor="middle" class="text">DeviceOutputBus</text><rect x="960" y="395" width="220" height="60" class="box"/><text x="1070" y="432" text-anchor="middle" class="text">OAction / OAxis 派发</text><rect x="960" y="475" width="220" height="60" class="box"/><text x="1070" y="512" text-anchor="middle" class="text">SetDO / 实际输出</text><rect x="1270" y="260" width="250" height="320" class="box"/><text x="1395" y="305" text-anchor="middle" class="label">目标设备</text><text x="1395" y="350" text-anchor="middle" class="text">动感平台</text><text x="1395" y="395" text-anchor="middle" class="text">特效设备</text><text x="1395" y="440" text-anchor="middle" class="text">执行机构</text><text x="1395" y="485" text-anchor="middle" class="small">安全输出后再进入硬件</text><path d="M350 430 L450 430" class="line"/><path d="M830 430 L930 430" class="line"/><path d="M1210 430 L1270 430" class="line"/></svg>