<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><defs><style>.title{font:700 28px 'Microsoft YaHei',sans-serif;fill:#10243e}.step{fill:#f7fbff;stroke:#305f86;stroke-width:2.4;rx:18;ry:18}.text{font:600 22px 'Microsoft YaHei',sans-serif;fill:#16324f}.small{font:500 16px 'Microsoft YaHei',sans-serif;fill:#44627e}.line{stroke:#355c7d;stroke-width:3.2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#355c7d"/></marker></defs><rect width="1200" height="1450" fill="#fff"/><text x="600" y="55" text-anchor="middle" class="title">图2 多控制源输出仲裁、安全约束与平滑回退的设备控制方法流程图</text><rect x="390" y="110" width="420" height="92" class="step"/><text x="600" y="160" text-anchor="middle" class="text">S1 获取多控制源候选输出值</text><text x="600" y="187" text-anchor="middle" class="small">包含通道标识、优先级、策略、当前值</text><rect x="390" y="255" width="420" height="92" class="step"/><text x="600" y="305" text-anchor="middle" class="text">S2 按目标输出通道分组</text><text x="600" y="332" text-anchor="middle" class="small">同名通道候选值聚合为一个集合</text><rect x="390" y="400" width="420" height="92" class="step"/><text x="600" y="450" text-anchor="middle" class="text">S3 执行统一仲裁</text><text x="600" y="477" text-anchor="middle" class="small">Priority / Blend / Max / Additive / Override</text><rect x="390" y="545" width="420" height="92" class="step"/><text x="600" y="595" text-anchor="middle" class="text">S4 执行值域钳位</text><text x="600" y="622" text-anchor="middle" class="small">限制在安全范围内</text><rect x="390" y="690" width="420" height="92" class="step"/><text x="600" y="740" text-anchor="middle" class="text">S5 执行变化速率限制</text><text x="600" y="767" text-anchor="middle" class="small">相邻周期变化量不得超过阈值</text><rect x="390" y="835" width="420" height="92" class="step"/><text x="600" y="885" text-anchor="middle" class="text">S6 判断是否发生停止或结束事件</text><text x="600" y="912" text-anchor="middle" class="small">停止 / 退出 / 播放结束</text><rect x="390" y="980" width="420" height="92" class="step"/><text x="600" y="1030" text-anchor="middle" class="text">S7 平滑回退至安全目标值</text><text x="600" y="1057" text-anchor="middle" class="small">布尔型回退至 0，连续型回退至中性值或安全值</text><rect x="390" y="1145" width="420" height="92" class="step"/><text x="600" y="1195" text-anchor="middle" class="text">S8 派发最终输出值</text><text x="600" y="1222" text-anchor="middle" class="small">统一安全输出进入设备派发</text><path d="M600 202 L600 255" class="line"/><path d="M600 347 L600 400" class="line"/><path d="M600 492 L600 545" class="line"/><path d="M600 637 L600 690" class="line"/><path d="M600 782 L600 835" class="line"/><path d="M600 927 L600 980" class="line"/><path d="M600 1072 L600 1145" class="line"/></svg>